search:
  provider: handoff             # handoff (no key, Claude Code answers), claude, or gemini
  claude_model: claude-sonnet-5-5
  gemini_model: "gemini-3.5-flash-lite"  # supports Google Search grounding
  max_results_per_query: 10

llm:
  provider: handoff             # handoff (no key), anthropic, or gemini
  main_model: claude-sonnet-5-5
  cheap_model: claude-haiku-4-5 # there is no claude-haiku-5-5; Haiku 4.5 is the current Haiku
  gemini_main_model: gemini-3.5-flash-lite
  gemini_cheap_model: gemini-3.5-flash-lite
  max_tokens: 16000

resolve:
  min_confidence: 0.6

research:
  recency_days: 180
  max_pages_per_company: 60
  fetch_timeout_seconds: 15
  max_chars_per_page: 12000     # page text sent to the AI per evidence record (full text is still saved)
  evidence_batch_size: 6
  blocked_domains: [flowcode.com]

verify:
  quote_match_threshold: 0.9

scoring:
  strong_threshold: 3.5
  strong_industries: [retail and consumer goods, sports and entertainment, media]
  opportunity_weights:
    timing: 0.25
    playbook_fit: 0.25
    reach: 0.20
    evidence_strength: 0.15
    openness: 0.15
  company_weights:
    best_opportunity: 0.40
    strong_count: 0.20
    company_size: 0.20
    industry_fit: 0.10
    new_activity: 0.10

batch:
  concurrency: 4

paths:
  db: flowcode.db
  outputs: outputs
  prompts: prompts
  playbook: playbook.yaml
  existing_customers: existing_customers.yaml
  handoff: handoff
  calls_log: logs/api_calls.jsonl   # one line per AI call and search, for cost analysis

# Prices for the cost estimate on the Usage page (US dollars, Anthropic list prices as of Nov 2026;
# check https://www.anthropic.com/pricing). Claude Code runs are estimated the same way.
pricing:
  web_search_per_1k: 10
  models:
    claude-sonnet-5-5: {input_per_mtok: 2, output_per_mtok: 10}
    claude-haiku-4-5: {input_per_mtok: 1, output_per_mtok: 5}
